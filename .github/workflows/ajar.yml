name: Ajar job search

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC), 4 times a day
  workflow_dispatch:
    inputs:
      command:
        description: "doctor = test connections, run = search now"
        type: choice
        options: [doctor, run]
        default: doctor

permissions:
  contents: read

concurrency:
  group: ajar-run          # never two searches at the same time
  cancel-in-progress: false

jobs:
  ajar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m ajar.app "$AJAR_COMMAND"
        env:
          AJAR_COMMAND: ${{ inputs.command || 'run' }}
          AJAR_PAUSED: ${{ vars.AJAR_PAUSED }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
